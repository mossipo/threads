<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads self-test</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app/styles.css">
<style>
  body { padding-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  td, th { border-bottom: 1px solid var(--line); padding: 6px; vertical-align: top; text-align: left; }
  .pass { color: var(--ok); font-weight: 700; } .fail { color: var(--warn); font-weight: 700; }
  iframe { width: 390px; height: 700px; border: 1px solid var(--line); position: absolute; left: -9999px; }
</style>
</head>
<body>
<main>
  <h1>Threads self-test</h1>
  <p class="small muted">These checks were written by Claude from the Threads specification, because the specification's acceptance test list was not included in what Barry sent. Each check runs against the live data in this copy of the app.</p>
  <p id="summary" class="weight">Running</p>
  <table><thead><tr><th>#</th><th>Check</th><th>Result</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table>
  <p><a href="./">Back to Threads</a></p>
</main>
<iframe id="app" title="Threads under test" src="about:blank"></iframe>
<script type="module" src="app/selftest.js"></script>
</body>
</html>
